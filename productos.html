<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos NOVA.">
  <title>NOVA | Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Navegación principal">
      <a class="logo" href="index.html">NOVA<span>.</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Inicio</a></li>
        <li><a class="active" href="productos.html">Productos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <a class="cart" href="#catalogo" aria-label="Carrito">🛒 <span id="cartCount">0</span></a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="eyebrow">CATÁLOGO</p>
      <h1>Todos los productos</h1>
      <p>Explorá nuestra colección y encontrá tu próximo favorito.</p>
    </section>

    <section id="catalogo" class="catalog">
      <div class="search-row">
        <label class="search-box" for="searchInput">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar productos..." autocomplete="off">
        </label>
        <span id="resultsCount" class="results-count"></span>
      </div>
      <div class="product-grid" id="productGrid">
        <p class="loading">Cargando catálogo...</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container footer-content">
      <div><strong>NOVA.</strong><p>E-commerce frontend · Sprint 2</p></div>
      <div><p>HTML · CSS · JavaScript · DOM</p></div>
    </div>
  </footer>
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
